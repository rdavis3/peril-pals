<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PERIL PALS Cover</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Nunito,sans-serif;background:#10142a;color:white}.cover{position:relative;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(circle at 72% 38%,#293566 0,transparent 37%),radial-gradient(circle at 8% 100%,rgba(82,217,232,.18),transparent 31%),linear-gradient(135deg,#10142a,#1b2143)}.grid-bg{position:absolute;inset:-20%;opacity:.14;transform:rotate(-8deg);background-image:linear-gradient(rgba(82,217,232,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(82,217,232,.35) 2px,transparent 2px);background-size:68px 68px}.copy{position:absolute;z-index:5;left:6.8%;top:9%;width:50%}.eye{width:112px;height:112px;margin:0 0 18px -4px;display:block;filter:drop-shadow(0 0 24px rgba(82,217,232,.25))}.eyebrow{color:#9aa6d5;font-size:16px;font-weight:900;letter-spacing:.2em}.title{margin:8px 0 18px;font:700 112px/.72 Fredoka,sans-serif;letter-spacing:-.07em}.title span{display:block;margin-left:.42em;color:#52d9e8}.tag{font-size:29px;font-weight:900;color:#d8ddf8}.pill{display:inline-flex;gap:15px;margin-top:28px;padding:11px 17px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(255,255,255,.07);font-size:14px;font-weight:900}.pill b{color:#ffd166}.devices{position:absolute;z-index:3;right:3%;bottom:-8%;width:50%;height:95%}.phone{position:absolute;width:45%;height:78%;padding:14px;border:7px solid #edf3ff;border-radius:32px;background:#11162e;box-shadow:0 35px 70px rgba(0,0,0,.42)}.phone.one{left:0;top:4%;transform:rotate(-7deg)}.phone.two{right:0;bottom:0;transform:rotate(7deg)}.phone-label{height:10%;display:flex;align-items:center;gap:7px;color:#cdd5f4;font-size:11px;font-weight:900}.phone-label i{width:11px;height:11px;border-radius:50%;background:#52d9e8;box-shadow:0 0 10px #52d9e8}.board{height:86%;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(6,1fr);gap:5px}.cell{position:relative;display:grid;place-items:center;border:1px solid rgba(140,164,226,.22);border-radius:7px;background:rgba(255,255,255,.04);color:#8290ba;font-size:8px}.haz{width:70%;aspect-ratio:1;display:grid;place-items:center;border:2px solid currentColor;border-radius:8px;font-size:17px}.laser{color:#ff426f;background:rgba(255,66,111,.1)}.crack{color:#ff9f43;background:rgba(255,159,67,.1)}.slime{color:#55c97a;background:rgba(85,201,122,.1)}.glitch{color:#aa82ff;background:rgba(170,130,255,.1)}.robot{width:72%;aspect-ratio:1;display:grid;place-items:center;border:3px solid #52d9e8;border-radius:9px;color:#52d9e8;font:700 22px Fredoka;background:#172044}.exit{color:#67d391;font-size:28px;text-shadow:0 0 17px #67d391}.ping{position:absolute;right:-4px;top:-5px;width:21px;height:21px;display:grid;place-items:center;border:2px solid white;border-radius:50%;color:white;background:#ffd166;font-size:11px;font-weight:900}.truth{position:absolute;z-index:8;right:4.5%;top:6%;padding:10px 16px;border-radius:999px;color:#10142a;background:#ffd166;font-size:13px;font-weight:900;transform:rotate(4deg);box-shadow:0 7px 0 rgba(0,0,0,.2)}
    </style>
  </head>
  <body>
    <main class="cover">
      <div class="grid-bg"></div>
      <section class="copy"><img class="eye" src="/peril-pals-mark.svg" alt=""><div class="eyebrow">A CO-OP GAME OF INCOMPLETE INFORMATION</div><h1 class="title">PERIL<span>PALS</span></h1><div class="tag">Nobody sees the whole truth.</div><div class="pill">2–8 PLAYERS <b>DIFFERENT SCREENS</b> ONE SAFE PATH</div></section>
      <div class="truth">MULTIPLAYER IS THE MECHANIC</div>
      <section class="devices">
        <div class="phone one"><div class="phone-label"><i></i> YOUR VIEW: LASERS + SLIME</div><div class="board">
          <span class="cell"></span><span class="cell"><i class="haz laser">⚡</i></span><span class="cell"></span><span class="cell"></span><span class="cell"><i class="exit">◎</i></span>
          <span class="cell"></span><span class="cell"></span><span class="cell"><i class="haz slime">●</i></span><span class="cell"></span><span class="cell"></span>
          <span class="cell"><i class="haz laser">⚡</i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"><i class="haz slime">●</i></span>
          <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span><span class="cell"><i class="haz laser">⚡</i><b class="ping">!</b></span><span class="cell"></span><span class="cell"></span>
          <span class="cell"><i class="robot">⌁</i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
        </div></div>
        <div class="phone two"><div class="phone-label"><i style="background:#aa82ff"></i> THEIR VIEW: CRACKS + GLITCHES</div><div class="board">
          <span class="cell"></span><span class="cell"></span><span class="cell"><i class="haz crack">✦</i></span><span class="cell"></span><span class="cell"><i class="exit">◎</i></span>
          <span class="cell"><i class="haz glitch">◆</i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"><i class="haz crack">✦</i></span><span class="cell"></span><span class="cell"><i class="haz glitch">◆</i></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          <span class="cell"></span><span class="cell"></span><span class="cell"><b class="ping">!</b></span><span class="cell"><i class="haz crack">✦</i></span><span class="cell"></span>
          <span class="cell"><i class="robot">⌁</i></span><span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"><i class="haz glitch">◆</i></span>
        </div></div>
      </section>
    </main>
  </body>
</html>
