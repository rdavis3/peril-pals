<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">PERIL PALS signal eye</title>
  <desc id="desc">A precise cyan and violet eye surrounding two linked signal lenses.</desc>
  <defs>
    <linearGradient id="signal" x1="30" y1="56" x2="226" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#64E7E4"/>
      <stop offset=".55" stop-color="#52D9E8"/>
      <stop offset="1" stop-color="#AA82FF"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="34%" r="70%">
      <stop stop-color="#87F5F1"/>
      <stop offset=".48" stop-color="#52D9E8"/>
      <stop offset="1" stop-color="#5B8CFF"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
